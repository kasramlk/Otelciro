        const Heatmap = () => {
            return (
                <div className="bg-white p-8 rounded-2xl border border-gray-100 shadow-sm">
                    <div className="flex items-center justify-between mb-6">
                        <div>
                            <h3 className="text-lg font-bold text-gray-800">Doluluk Isı Haritası</h3>
                            <p className="text-sm text-gray-500">Günlük yoğunluk analizi</p>
                        </div>
                        <div className="flex items-center space-x-2 text-xs text-gray-500">
                            <div className="flex items-center"><span className="w-3 h-3 bg-gray-100 rounded mr-1"></span>Boş</div>
                            <div className="flex items-center"><span className="w-3 h-3 bg-green-200 rounded mr-1"></span>Düşük</div>
                            <div className="flex items-center"><span className="w-3 h-3 bg-green-400 rounded mr-1"></span>Orta</div>
                            <div className="flex items-center"><span className="w-3 h-3 bg-green-600 rounded mr-1"></span>Yüksek</div>
                            <div className="flex items-center"><span className="w-3 h-3 bg-red-700 rounded mr-1"></span>Tam</div>
                        </div>
                    </div>
                    <div className="heatmap-grid">
                        {Object.entries(OCCUPANCY_DATA).map(([date, count]) => {
                            let colorClass = "bg-gray-100 text-gray-400";
                            if (count >= 8) colorClass = "bg-red-700 text-white shadow-sm ring-1 ring-red-800";
                            else if (count >= 5) colorClass = "bg-green-600 text-white shadow-sm";
                            else if (count >= 3) colorClass = "bg-green-400 text-white";
                            else if (count > 0) colorClass = "bg-green-200 text-green-800";
                            
                            const day = date.split('-')[2];
                            return (
                                <div 
                                    key={date} 
                                    className={`h-9 rounded-lg flex items-center justify-center text-xs font-bold transition-all hover:scale-110 hover:z-10 cursor-help ${colorClass}`} 
                                    title={`${date}: ${count} Oda Dolu`}
                                >
                                    {day}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const TransactionTable = ({ data }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const filteredData = data.filter(item => 
                item.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                item.channel.toLowerCase().includes(searchTerm.toLowerCase()) ||
                item.id.includes(searchTerm)
            );

            return (
                <div className="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                    <div className="p-6 border-b border-gray-100 flex flex-col md:flex-row justify-between items-center gap-4 bg-gray-50/50">
                        <div>
                            <h3 className="text-lg font-bold text-gray-800">İşlem Hareketleri</h3>
                            <p className="text-sm text-gray-500">Tüm rezervasyon kayıtları</p>
                        </div>
                        <div className="relative w-full md:w-72">
                            <input 
                                type="text" 
                                placeholder="Misafir, ID veya Kanal ara..." 
                                className="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-b-blue/20 focus:border-b-blue transition-all"
                                onChange={(e) => setSearchTerm(e.target.value)}
                            />
                            <svg className="w-4 h-4 absolute left-3.5 top-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                    </div>
                    <div className="overflow-x-auto max-h-[500px] overflow-y-auto custom-scrollbar">
                        <table className="w-full text-sm text-left text-gray-500">
                            <thead className="text-xs text-gray-700 uppercase bg-gray-50/80 backdrop-blur table-sticky-header">
                                <tr>
                                    <th className="px-6 py-4 font-bold text-b-navy">ID</th>
                                    <th className="px-6 py-4 font-bold text-b-navy">Tarih</th>
                                    <th className="px-6 py-4 font-bold text-b-navy">Misafir</th>
                                    <th className="px-6 py-4 font-bold text-b-navy">Konaklama</th>
                                    <th className="px-6 py-4 font-bold text-b-navy text-center">Gece</th>
                                    <th className="px-6 py-4 font-bold text-b-navy text-right">Tutar</th>
                                    <th className="px-6 py-4 font-bold text-b-navy">Kanal</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {filteredData.map((row) => (
                                    <tr key={row.id} className="bg-white hover:bg-blue-50/30 transition-colors group">
                                        <td className="px-6 py-4 font-medium text-gray-900 group-hover:text-b-blue transition-colors">#{row.id}</td>
                                        <td className="px-6 py-4 text-xs">{row.date}</td>
                                        <td className="px-6 py-4 font-medium text-gray-800">{row.name}</td>
                                        <td className="px-6 py-4 whitespace-nowrap text-xs">
                                            <div className="flex flex-col">
                                                <span className="text-gray-600">Giriş: {row.checkin.slice(0,5)}</span>
                                                <span className="text-gray-400">Çıkış: {row.checkout.slice(0,5)}</span>
                                            </div>
                                        </td>
                                        <td className="px-6 py-4 text-center">
                                            <span className="bg-gray-100 text-gray-600 py-1 px-2.5 rounded-md text-xs font-bold">{row.nights}</span>
                                        </td>
                                        <td className="px-6 py-4 text-right font-bold text-gray-900">
                                            {new Intl.NumberFormat('tr-TR', { style: 'currency', currency: row.currency, maximumFractionDigits: 0 }).format(row.amount)}
                                        </td>
                                        <td className="px-6 py-4">
                                            <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${
                                                row.channel === 'Direct' ? 'bg-green-50 text-green-700 border-green-100' :
                                                row.channel === 'Odamax' ? 'bg-blue-50 text-blue-700 border-blue-100' :
                                                'bg-gray-50 text-gray-600 border-gray-200'
                                            }`}>
                                                {row.channel}
                                            </span>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const Dashboard = () => {
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [activeSection, setActiveSection] = useState('overview');

            // --- SCROLL SPY LOGIC ---
            useEffect(() => {
                const handleScroll = () => {
                    const sections = ['overview', 'heatmap', 'trends', 'transactions'];
                    const scrollPosition = window.scrollY + 100; // Offset for header

                    for (const sectionId of sections) {
                        const element = document.getElementById(sectionId);
                        if (element && element.offsetTop <= scrollPosition && (element.offsetTop + element.offsetHeight) > scrollPosition) {
                            setActiveSection(sectionId);
                        }
                    }
                };

                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            // --- DYNAMIC CALCULATIONS ---
            const kpiData = useMemo(() => {
                const totalTry = RAW_TRANSACTIONS.reduce((sum, r) => sum + (r.currency === 'TRY' ? r.amount : 0), 0);
                const totalEur = RAW_TRANSACTIONS.reduce((sum, r) => sum + (r.currency === 'EUR' ? r.amount : 0), 0);
                const eurRes = RAW_TRANSACTIONS.filter(r => r.currency === 'EUR');
                const avgEurAdr = eurRes.length ? eurRes.reduce((sum, r) => sum + r.amount, 0) / eurRes.reduce((sum, r) => sum + r.nights, 0) : 0;
                
                return { revenueTRY: totalTry, revenueEUR: totalEur, totalReservations: RAW_TRANSACTIONS.length, adrEUR: avgEurAdr };
            }, []);

            const weeklyTrendData = useMemo(() => {
                const days = ["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"];
                const counts = new Array(7).fill(0);
                RAW_TRANSACTIONS.forEach(r => {
                    let dayIndex = new Date(r.checkin_raw).getDay() - 1; 
                    if (dayIndex === -1) dayIndex = 6; 
                    counts[dayIndex]++;
                });
                return days.map((day, i) => ({ name: day, value: counts[i] }));
            }, []);

            const channelChartData = useMemo(() => {
                const counts = {};
                RAW_TRANSACTIONS.forEach(r => { counts[r.channel] = (counts[r.channel] || 0) + 1; });
                return Object.entries(counts).map(([name, value]) => ({ name, value })).sort((a,b) => b.value - a.value);
            }, []);

            const fmtTRY = (val) => new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY', maximumFractionDigits: 0 }).format(val);
            const fmtEUR = (val) => new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(val);

            // Recharts fallback check
            if (!window.Recharts || !BarChart) return <div className="min-h-screen flex items-center justify-center text-b-navy font-bold">Panel Yükleniyor...</div>;

            return (
                <div className="flex min-h-screen bg-[#F3F4F6]">
                    <Sidebar isOpen={isSidebarOpen} toggleSidebar={() => setIsSidebarOpen(!isSidebarOpen)} activeSection={activeSection} />
                    
                    <main className="flex-1 md:ml-64 p-6 md:p-10 w-full transition-all duration-300">
                        <header className="flex justify-between items-center mb-10 sticky top-0 bg-[#F3F4F6]/90 backdrop-blur z-30 py-4 -mx-6 px-6 md:-mx-10 md:px-10" id="overview">
                            <div className="flex items-center">
                                <button className="mr-4 md:hidden text-b-navy p-2 hover:bg-white hover:shadow-sm rounded-lg transition-all" onClick={() => setIsSidebarOpen(true)}><Menu size={24} /></button>
                                <div>
                                    <h1 className="text-2xl md:text-3xl font-extrabold text-gray-900 tracking-tight">Performans Paneli</h1>
                                    <div className="flex items-center mt-1">
                                        <span className="w-2 h-2 rounded-full bg-green-500 mr-2 animate-pulse"></span>
                                        <p className="text-sm font-medium text-gray-500">Sistem Çevrimiçi • Son Güncelleme: 23:38</p>
                                    </div>
                                </div>
                            </div>
                            <div className="hidden md:block">
                                <button className="bg-white border border-gray-200 text-gray-700 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-gray-50 hover:border-gray-300 transition-all shadow-sm">
                                    Raporu İndir
                                </button>
                            </div>
                        </header>

                        {/* KPI Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                            <KPICard title="TOPLAM CİRO (TRY)" value={fmtTRY(kpiData.revenueTRY)} subtext="İç pazar ve doğrudan satışlar" icon={Wallet} />
                            <KPICard title="TOPLAM CİRO (EUR)" value={fmtEUR(kpiData.revenueEUR)} subtext="Yurt dışı kaynaklı gelirler" icon={Globe} />
                            <KPICard title="REZERVASYON" value={kpiData.totalReservations} subtext="Onaylı / Aktif Konaklamalar" icon={CalendarDays} />
                            <KPICard title="ORT. GÜNLÜK FİYAT (EUR)" value={fmtEUR(kpiData.adrEUR)} subtext="Döviz bazlı ortalama (ADR)" icon={TrendingUp} />
                        </div>

                        {/* HEATMAP */}
                        <div className="mb-10 scroll-mt-28" id="heatmap">
                            <Heatmap />
                        </div>

                        {/* Charts Grid */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-10 scroll-mt-28" id="trends">
                            <div className="bg-white p-8 rounded-2xl border border-gray-100 shadow-sm">
                                <h3 className="text-lg font-bold text-gray-800 mb-6">Haftalık Giriş Yoğunluğu</h3>
                                <div className="h-72">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={weeklyTrendData}>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#E5E7EB" />
                                            <XAxis dataKey="name" tick={{fontSize: 12, fill: '#6B7280'}} axisLine={false} tickLine={false} dy={10} />
                                            <YAxis hide />
                                            <Tooltip cursor={{fill: '#F3F4F6'}} contentStyle={{borderRadius: '12px', border: 'none', boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.1)'}} />
                                            <Bar dataKey="value" name="Rezervasyon" radius={[6, 6, 0, 0]} barSize={40}>
                                                {weeklyTrendData.map((entry, index) => (
                                                    <Cell key={`cell-${index}`} fill={index >= 5 ? COLORS.yellow : COLORS.navy} />
                                                ))}
                                            </Bar>
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                                <p className="text-xs text-gray-400 text-center mt-4 font-medium">*Sarı barlar hafta sonunu temsil eder.</p>
                            </div>

                            <div className="bg-white p-8 rounded-2xl border border-gray-100 shadow-sm">
                                <h3 className="text-lg font-bold text-gray-800 mb-6">Kanal Dağılımı (Adet)</h3>
                                <div className="flex items-center h-72">
                                    <div className="h-full w-1/2">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <PieChart>
                                                <Pie data={channelChartData} cx="50%" cy="50%" innerRadius={60} outerRadius={80} paddingAngle={4} dataKey="value">
                                                    {channelChartData.map((entry, index) => (
                                                        <Cell key={`cell-${index}`} fill={Object.values(COLORS)[index % Object.values(COLORS).length]} stroke="none" />
                                                    ))}
                                                </Pie>
                                                <Tooltip contentStyle={{borderRadius: '8px', border: 'none', boxShadow: '0 10px 15px -3px rgba(0, 0, 0, 0.1)'}} />
                                            </PieChart>
                                        </ResponsiveContainer>
                                    </div>
                                    <div className="w-1/2 pl-6 h-64 overflow-y-auto custom-scrollbar pr-2">
                                        {channelChartData.map((channel, idx) => (
                                            <div key={idx} className="flex justify-between items-center text-xs border-b border-gray-50 pb-2 mb-2 last:border-0 hover:bg-gray-50 p-1 rounded transition-colors">
                                                <div className="flex items-center">
                                                    <span className="w-2.5 h-2.5 rounded-full mr-2 shadow-sm" style={{backgroundColor: Object.values(COLORS)[idx % Object.values(COLORS).length]}}></span>
                                                    <span className="font-medium text-gray-700 truncate w-24" title={channel.name}>{channel.name}</span>
                                                </div>
                                                <span className="font-bold text-b-navy bg-blue-50 px-2 py-0.5 rounded-md">{channel.value}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Competitor Benchmark */}
                        <div className="bg-white p-8 rounded-2xl border border-gray-100 shadow-sm mb-10">
                            <div className="mb-6 flex flex-col md:flex-row justify-between items-start md:items-center">
                                <div>
                                    <h3 className="text-lg font-bold text-gray-800">Fiyat Rekabeti (ADR)</h3>
                                    <p className="text-sm text-gray-500">Euro bazında Wineport vs Rakip Seti</p>
                                </div>
                                <div className="mt-4 md:mt-0 flex gap-3 text-xs font-bold">
                                    <div className="flex items-center"><span className="w-3 h-3 bg-b-navy rounded-full mr-2"></span>Wineport</div>
                                    <div className="flex items-center"><span className="w-3 h-3 bg-b-blue rounded-full mr-2"></span>Rakipler</div>
                                </div>
                            </div>
                            <div className="h-64 mb-6">
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={BENCHMARK_DATA} layout="vertical" margin={{top: 0, right: 30, left: 40, bottom: 0}} barGap={4}>
                                        <CartesianGrid strokeDasharray="3 3" horizontal={true} vertical={false} stroke="#E5E7EB"/>
                                        <XAxis type="number" hide />
                                        <YAxis dataKey="month" type="category" axisLine={false} tickLine={false} width={60} tick={{fontWeight: '600', fill: '#4B5563'}} />
                                        <Tooltip cursor={{fill: '#F9FAFB'}} formatter={(val) => `${val}€`} contentStyle={{borderRadius: '8px'}} />
                                        <Bar dataKey="wineport" name="Wineport" fill={COLORS.navy} radius={[0, 4, 4, 0]} barSize={20} />
                                        <Bar dataKey="compset" name="Rakipler Ort." fill={COLORS.blue} radius={[0, 4, 4, 0]} barSize={20} />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                            <div className="border-t border-gray-100 pt-4 bg-gray-50/50 -mx-8 -mb-8 px-8 pb-6 rounded-b-2xl">
                                <div className="flex items-center mb-3 text-b-blue">
                                    <Info size={16} className="mr-2" />
                                    <span className="text-xs font-bold uppercase tracking-wider">Rakip Seti Detayı</span>
                                </div>
                                <div className="flex flex-wrap gap-2">
                                    {COMPETITOR_SET.map((hotel, idx) => (
                                        <span key={idx} className="text-[10px] font-medium bg-white text-gray-600 px-3 py-1.5 rounded-lg border border-gray-200 shadow-sm hover:shadow-md hover:text-b-blue transition-all cursor-default">{hotel}</span>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Transaction Table */}
                        <div id="transactions" className="scroll-mt-28">
                            <TransactionTable data={RAW_TRANSACTIONS} />
                        </div>

                        <footer className="mt-12 text-center border-t border-gray-200 pt-8 pb-4">
                            <p className="text-gray-400 text-xs font-medium">Wineport Ağva Yönetim Paneli &copy; 2025</p>
                            <p className="text-gray-300 text-[10px] mt-1">Gizli Şirket Verisidir • İzinsiz Paylaşılamaz</p>
                        </footer>
                    </main>
                </div>
            );
        };

        // --- SAFE INITIALIZATION LOGIC ---
        function initApp() {
            const rootElement = document.getElementById('root');
            if (rootElement) {
                const root = ReactDOM.createRoot(rootElement);
                root.render(<Dashboard />);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
